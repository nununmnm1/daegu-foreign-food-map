<style>
/* Layout: 데스크톱은 좌측 목록 패널 + 우측 지도, 폭 860px 이하에서는 지도 위 · 목록 아래로 쌓는다 */
:root {
  --bg: #f3f4f1;
  --panel: #fbfbf9;
  --ink: #1d2422;
  --muted: #5d6763;
  --line: #d9ddd8;
  --land: #e6e9e3;
  --land-line: #9aa59f;
  --accent: #1f5f53;
  --accent-soft: #dcebe6;
  --font-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --c-jung: #c2452d; --c-dong: #2f7a3f; --c-seo: #7b4fb0; --c-nam: #c98a12;
  --c-buk: #2563a8; --c-suseong: #bf3f86; --c-dalseo: #138a8a; --c-dalseong: #6b6f2a; --c-gunwi: #6d6d6d;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151a19; --panel: #1b2120; --ink: #e7ece9; --muted: #9aa6a1; --line: #2e3735;
  --land: #222a28; --land-line: #4f5c58; --accent: #6cc3ad; --accent-soft: #233a35;
  --c-jung: #f07a5f; --c-dong: #6cc27a; --c-seo: #b48ce8; --c-nam: #f0b445;
  --c-buk: #6aa7ee; --c-suseong: #ee7fbd; --c-dalseo: #4fcfcf; --c-dalseong: #b9bd6a; --c-gunwi: #a0a0a0;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151a19; --panel: #1b2120; --ink: #e7ece9; --muted: #9aa6a1; --line: #2e3735;
  --land: #222a28; --land-line: #4f5c58; --accent: #6cc3ad; --accent-soft: #233a35;
  --c-jung: #f07a5f; --c-dong: #6cc27a; --c-seo: #b48ce8; --c-nam: #f0b445;
  --c-buk: #6aa7ee; --c-suseong: #ee7fbd; --c-dalseo: #4fcfcf; --c-dalseong: #b9bd6a; --c-gunwi: #a0a0a0;
  color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; }
.app { height: 100%; display: grid; grid-template-columns: 380px 1fr; min-height: 0; }
.panel { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel); border-right: 1px solid var(--line); }
.head { padding-block: 20px 14px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 20px; display: grid; gap: 12px; border-bottom: 1px solid var(--line); }
.eyebrow { font-size: 12px; letter-spacing: .06em; color: var(--muted); }
h1 { margin: 0; font-family: var(--font-display); font-size: 26px; line-height: 1.25; text-wrap: balance; }
h1 .count { color: var(--accent); font-variant-numeric: tabular-nums; }
.search { width: 100%; box-sizing: border-box; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.search:focus-visible, .chip:focus-visible, .item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.chip:disabled { opacity: .45; cursor: default; }
.list { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
.item { display: grid; grid-template-columns: 10px 1fr; gap: 10px; padding-block: 11px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 20px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item:hover, .item.on { background: var(--accent-soft); }
.item .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--c); }
.item .nm { font-weight: 600; overflow-wrap: anywhere; }
.item .ad { color: var(--muted); font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
.empty { padding: 24px 20px; color: var(--muted); }
.foot { padding-block: 10px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 20px; font-size: 12px; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--line); }

.mapwrap { position: relative; min-height: 0; min-width: 0; }
#map { position: absolute; inset: 0; background: var(--bg); }
.leaflet-container { font-family: var(--font-body); }
.leaflet-tile-pane { opacity: .9; }
.gu-label { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg); pointer-events: none; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--ink); box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.leaflet-popup-content-wrapper { border-radius: 10px; }
.leaflet-popup-content { margin: 14px 16px; font-size: 14px; line-height: 1.5; max-width: 300px; }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
.pop + .pop { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.pop .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.pop .tag .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.pop .nm { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin: 2px 0 4px; overflow-wrap: anywhere; }
.pop .ad { overflow-wrap: anywhere; }
.pop .sub { color: var(--muted); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
.pop .stack { font-size: 12px; color: var(--accent); margin-bottom: 8px; }
.leaflet-control-attribution { background: color-mix(in srgb, var(--panel) 80%, transparent) !important; color: var(--muted); }
.leaflet-control-attribution a { color: var(--accent); }
.leaflet-bar a { background: var(--panel); color: var(--ink); border-bottom-color: var(--line); }
.leaflet-bar a:hover { background: var(--accent-soft); }
.reset { position: absolute; z-index: 500; top: calc(10px + env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.12); }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) minmax(0, 42%); }
  .panel { display: contents; }
  .head { grid-row: 1; padding-block: 12px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 8px; background: var(--panel); }
  h1 { font-size: 20px; }
  .eyebrow { display: none; }
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding-inline: 4px; }
  .chip { flex: none; }
  .mapwrap { grid-row: 2; }
  .list { grid-row: 3; background: var(--panel); border-top: 1px solid var(--line); }
  .item { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .foot { display: none; }
  .leaflet-popup-content { max-width: 240px; }
}
@media (prefers-reduced-motion: reduce) { .leaflet-fade-anim .leaflet-popup, .leaflet-zoom-anim .leaflet-zoom-animated { transition: none !important; } }
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>

<body>
<div class="app">
  <aside class="panel">
    <div class="head">
      <div class="eyebrow">업태구분 · 외국음식전문점(인도, 태국 등) · 영업/정상</div>
      <h1>대구 외국음식전문점 <span class="count" id="count">184</span>곳</h1>
      <input class="search" id="q" type="search" placeholder="업소명, 주소, 동 이름으로 찾기" aria-label="업소 검색">
      <div class="chips" id="chips" role="group" aria-label="구·군 필터"></div>
    </div>
    <ul class="list" id="list"></ul>
    <div class="foot">대구광역시 일반음식점 인허가 데이터 기준(2026년 10월). 좌표는 원본 EPSG:5174를 WGS84로 변환했습니다. 업태 분류 기준이라 외국인이 운영하는 식당 전체와는 다를 수 있습니다.</div>
  </aside>
  <div class="mapwrap">
    <div id="map" role="application" aria-label="대구 외국음식전문점 위치 지도"></div>
    <button class="reset" id="reset" type="button">전체 보기</button>
  </div>
</div>

35.85147],[128.52137,35.86658],[128.52822,35.8859]]]}},{"type":"Feature","properties":{"name":"동구"},"geometry":{"type":"Polygon","coordinates":[[[128.64285,36.00757],[128.69748,36.01331],[128.7278,36.00182],[128.7374,35.98992],[128.7483,35.96782],[128.74061,35.95322],[128.74063,35.9254],[128.75886,35.91185],[128.76543,35.8809],[128.75389,35.85408],[128.72837,35.85411],[128.68793,35.85636],[128.67677,35.87091],[128.65175,35.87541],[128.63208,35.86382],[128.61697,35.86518],[128.61255,35.8719],[128.63368,35.89151],[128.63511,35.91266],[128.62174,35.97121],[128.60607,35.98554],[128.61971,36.00346],[128.64285,36.00757]]]}},{"type":"Feature","properties":{"name":"중구"},"geometry":{"type":"Polygon","coordinates":[[[128.5824,35.87608],[128.61255,35.8719],[128.61697,35.86518],[128.6107,35.85195],[128.57681,35.85706],[128.57643,35.85968],[128.5824,35.87608]]]}}]};
const GU = [
  ["중구","jung"],["동구","dong"],["서구","seo"],["남구","nam"],["북구","buk"],
  ["수성구","suseong"],["달서구","dalseo"],["달성군","dalseong"],["군위군","gunwi"]
];
const guKey = Object.fromEntries(GU);
const css = getComputedStyle(document.documentElement);
const color = gu => css.getPropertyValue("--c-" + (guKey[gu] || "gunwi")).trim();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

POINTS.forEach((p, i) => { p.id = i; p.text = (p.n + " " + p.road + " " + p.jibun + " " + p.dong + " " + p.gu).toLowerCase(); });

const map = L.map("map", { zoomControl: true, preferCanvas: false, attributionControl: true });
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

const land = L.geoJSON(GEO, {
  style: () => ({ color: css.getPropertyValue("--land-line").trim(), weight: 1.2, fillColor: css.getPropertyValue("--land").trim(), fillOpacity: .35 }),
  interactive: false
}).addTo(map);
GEO.features.forEach(f => {
  const c = L.geoJSON(f).getBounds().getCenter();
  L.marker(c, { interactive: false, icon: L.divIcon({ className: "gu-label", html: esc(f.properties.name), iconSize: null }) }).addTo(map);
});

// 같은 건물(같은 좌표)에 여러 업소가 있으면 점 하나로 묶고 팝업에 모두 보여준다
const groups = new Map();
POINTS.forEach(p => {
  const k = p.lat + "," + p.lng;
  if (!groups.has(k)) groups.set(k, []);
  groups.get(k).push(p);
});
const markerOf = new Map();
const layer = L.layerGroup().addTo(map);

function popupHtml(items) {
  const head = items.length > 1 ? `<div class="stack">같은 위치 ${items.length}곳</div>` : "";
  return head + items.map(p => `
    <div class="pop" style="--c:${color(p.gu)}">
      <div class="tag"><span class="dot"></span>${esc(p.gu)} ${esc(p.dong)}</div>
      <div class="nm">${esc(p.n)}</div>
      <div class="ad">${esc(p.road || p.jibun)}</div>
      ${p.road && p.jibun ? `<div class="sub">지번 ${esc(p.jibun.replace(/^대구광역시\s*/, ""))}</div>` : ""}
      <div class="sub">인허가 ${esc(p.date)}</div>
    </div>`).join("");
}

let active = new Set(GU.map(g => g[0]));
let query = "";
const visible = p => active.has(p.gu) && (!query || p.text.includes(query));

function render() {
  layer.clearLayers(); markerOf.clear();
  const shown = POINTS.filter(visible);
  for (const items of groups.values()) {
    const vis = items.filter(visible);
    if (!vis.length) continue;
    const m = L.circleMarker([vis[0].lat, vis[0].lng], {
      radius: vis.length > 1 ? 8 : 6.5, weight: 1.5, color: css.getPropertyValue("--panel").trim(),
      fillColor: color(vis[0].gu), fillOpacity: .92
    }).bindPopup(popupHtml(vis), { maxWidth: 300, autoPanPadding: [24, 24] });
    m.bindTooltip(vis.length > 1 ? `${vis[0].n} 외 ${vis.length - 1}곳` : vis[0].n, { direction: "top", offset: [0, -6] });
    m.addTo(layer);
    vis.forEach(p => markerOf.set(p.id, m));
  }
  document.getElementById("count").textContent = shown.length;
  const list = document.getElementById("list");
  list.innerHTML = shown.length ? shown.map(p => `
    <li class="item" tabindex="0" data-id="${p.id}" style="--c:${color(p.gu)}">
      <span class="dot"></span>
      <div><div class="nm">${esc(p.n)}</div><div class="ad">${esc(p.road || p.jibun)}</div></div>
    </li>`).join("") : `<li class="empty">조건에 맞는 업소가 없습니다. 검색어를 지우거나 구·군을 다시 선택해 보세요.</li>`;
}

function focusPoint(id) {
  const m = markerOf.get(id); if (!m) return;
  document.querySelectorAll(".item.on").forEach(e => e.classList.remove("on"));
  document.querySelector(`.item[data-id="${id}"]`)?.classList.add("on");
  map.setView(m.getLatLng(), Math.max(map.getZoom(), 16));
  m.openPopup();
}

const counts = {};
POINTS.forEach(p => counts[p.gu] = (counts[p.gu] || 0) + 1);
const chips = document.getElementById("chips");
chips.innerHTML = `<button class="chip" type="button" id="chip-all" aria-pressed="true">전체</button>` +
  GU.map(([g]) => `<button class="chip" type="button" data-gu="${g}" aria-pressed="false" style="--c:${color(g)}" ${counts[g] ? "" : "disabled"}><span class="dot"></span>${g}<span class="n">${counts[g] || 0}</span></button>`).join("");
chips.addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b || b.disabled) return;
  if (b.id === "chip-all") active = new Set(GU.map(g => g[0]));
  else {
    const all = active.size === GU.length;
    if (all) active = new Set([b.dataset.gu]);
    else active.has(b.dataset.gu) ? active.delete(b.dataset.gu) : active.add(b.dataset.gu);
    if (!active.size) active = new Set(GU.map(g => g[0]));
  }
  const all = active.size === GU.length;
  chips.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.id === "chip-all" ? all : (!all && active.has(c.dataset.gu))));
  render(); fitVisible();
});

document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });
const listEl = document.getElementById("list");
listEl.addEventListener("click", e => { const it = e.target.closest(".item"); if (it) focusPoint(+it.dataset.id); });
listEl.addEventListener("keydown", e => { const it = e.target.closest(".item"); if (it && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); focusPoint(+it.dataset.id); } });

function fitVisible() {
  const pts = POINTS.filter(visible).map(p => [p.lat, p.lng]);
  if (pts.length) map.fitBounds(L.latLngBounds(pts), { padding: [30, 30], maxZoom: 15 });
}
document.getElementById("reset").addEventListener("click", () => { map.closePopup(); fitVisible(); });

render();
fitVisible();
new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById("map"));
</script>
